<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NeedleMail</title>
    <link rel="stylesheet" href="./styles.css">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
</head>

<body>
    <aside>
        <div class="brand"><span class="dot"></span> NeedleMail</div>
        <nav><button data-view="inbox" class="active">Inbox</button><button data-view="approvals">Approvals <b
                    id="approvalCount">0</b></button><button data-view="rules">Automation</button><button
                data-view="permissions">Permissions</button><button data-view="audit">Audit log</button></nav>
        <div class="sidebar-note">Needle 2 only<br><small>AI proposes. Permissions decide.</small></div>
    </aside>
    <main>
        <header>
            <div>
                <div class="eyebrow">AI EMAIL OPERATIONS</div>
                <h1 id="title">Inbox</h1>
            </div><button class="connect">Connect Gmail</button>
        </header>
        <section id="app"></section>
</body>

</html>
